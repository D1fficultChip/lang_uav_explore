shared_dir: /home/young/uav_demo/shared

infer_json: infer.json
infer_cue_json: infer_cue.json
target_localization_json: target_localization.json
prompt_txt: prompt.txt
frame_path: frame.jpg

tick_hz: 10.0
log_jsonl_path: plan_runtime.jsonl
event_jsonl_path: runtime_events.jsonl
stage_settle_s: 0.5

perception_request_json: perception_request.json
emit_cues_txt: true
cues_txt: cues.txt

mux:
  select_service: /cmd_mux/select
  hold_topic: /hold/pos_cmd
  selected_topic: /cmd_mux/selected
  pre_switch_hover_s: 0.3
  odom_topic: /ekf/ekf_odom
  odom_max_age_s: 0.3
  odom_wait_timeout_s: 5.0
  odom_cache_enabled: true
  odom_cache_max_age_s: 0.8
  odom_cache_restart_interval_s: 1.0
  odom_cache_allow_oneshot_fallback: false
  intent_source:
    SEARCH: /falcon/pos_cmd
    NAVIGATE: /ego/pos_cmd
    OBSERVE: /ego/pos_cmd
    TRACK: /ego/pos_cmd

ego_goal_topic: /move_base_simple/goal

ssh_defaults: &ssh_defaults
  transport: ssh
  target: nv@10.24.16.35
  ssh_extra_args:
    - -o
    - ConnectTimeout=5
    - -o
    - ServerAliveInterval=5
    - -o
    - ServerAliveCountMax=2

falcon_shell: &falcon_shell
  shell_prelude:
    - source /opt/ros/noetic/setup.bash
    - source /home/nv/uav_demo/src/falcon_catkin_ws/devel/setup.bash

ego_shell: &ego_shell
  shell_prelude:
    - source /opt/ros/noetic/setup.bash
    - source /home/nv/uav_demo/src/ego_ws/devel/setup.bash

ros_control_shell: &ros_control_shell
  shell_prelude:
    - source /opt/ros/noetic/setup.bash
    - export ROS_MASTER_URI=http://127.0.0.1:11311
    - if [ -f /home/nv/uav_demo/src/falcon_catkin_ws/devel/setup.bash ]; then source /home/nv/uav_demo/src/falcon_catkin_ws/devel/setup.bash; fi
    - if [ -f /home/nv/uav_demo/src/ego_ws/devel/setup.bash ]; then source /home/nv/uav_demo/src/ego_ws/devel/setup.bash; fi

ros_transport:
  <<: [*ssh_defaults, *ros_control_shell]

adapters:
  SEARCH:
    <<: [*ssh_defaults, *falcon_shell]
    cmd:
      - /home/nv/uav_demo/start_exploration.sh
    pidfile: /home/nv/uav_demo/src/shared/falcon_search.pid
    logfile: /home/nv/uav_demo/src/shared/falcon_search.log
    stop_pattern: roslaunch exploration_manager exploration.launch

  NAVIGATE:
    <<: [*ssh_defaults, *ego_shell]
    cmd:
      - /home/nv/uav_demo/start_track.sh
    pidfile: /home/nv/uav_demo/src/shared/ego_nav.pid
    logfile: /home/nv/uav_demo/src/shared/ego_nav.log
    stop_pattern: roslaunch ego_planner
    publish_goal_once: false
    goal_topic: /move_base_simple/goal
    startup_sleep_s: 0.5

  OBSERVE:
    <<: [*ssh_defaults, *ego_shell]
    cmd:
      - /home/nv/uav_demo/start_track.sh
    pidfile: /home/nv/uav_demo/src/shared/ego_nav.pid
    logfile: /home/nv/uav_demo/src/shared/ego_nav.log
    stop_pattern: roslaunch ego_planner
    publish_goal_once: false
    goal_topic: /move_base_simple/goal
    startup_sleep_s: 0.5

  TRACK:
    <<: [*ssh_defaults, *ego_shell]
    cmd:
      - /home/nv/uav_demo/start_track.sh
    pidfile: /home/nv/uav_demo/src/shared/ego_nav.pid
    logfile: /home/nv/uav_demo/src/shared/ego_nav.log
    stop_pattern: roslaunch ego_planner
    publish_goal_once: false
    goal_topic: /move_base_simple/goal
    startup_sleep_s: 0.5

verified:
  min_navigate_time_s: 2.0
  require_found: true
  min_score: 0.5
  visible_min_score: 0.5

intent_alias:
  INSPECT: TRACK

world_state:
  obs_ttl_s: 1.0
  cue_ttl_s: 2.0
  max_recent_evidence: 20

verification:
  require_req_match: true
  require_entity_match: true
  require_primary_role: true
  stable_hits_for_verify: 2
  max_detection_age_s: 1.0
  min_score: 0.5
  min_mask_quality: 0.55
  max_ambiguous_top2_gap: 0.08
  min_motion_progress_m: 0.3
  nav_stall_timeout_s: 5.0
  nav_goal_reached_tol_m: 0.8
  nav_progress_check_period_s: 1.0

diagnostics:
  max_events: 50

recovery:
  max_retries_per_stage: 2
  hold_reobserve_s: 2.0
  allow_fallback_to_search: true

escape:
  enabled: false
  intents: [SEARCH]
  backend: falcon
  odom_buffer_horizon_s: 45.0
  odom_sample_min_dist_m: 0.8
  odom_sample_max_interval_s: 2.0
  min_stage_dwell_s: 8.0
  stuck_window_s: 20.0
  stuck_min_progress_m: 0.5
  stuck_region_radius_m: 1.2
  min_rollback_dist_m: 1.5
  max_rollback_dist_m: 8.0
  max_escape_time_s: 12.0
  max_escape_retries: 2
  max_escape_per_stage: 3
  goal_retry_interval_s: 1.0
  progress_timeout_s: 4.0
  success_radius_m: 0.8
  success_min_anchor_clearance_m: 1.6
  failure_cooldown_s: 10.0
  mux_settle_s: 0.3

reasoner:
  enabled: false
  backend: noop
  base_url: https://api.openai.com/v1/chat/completions
  model: ""
  api_key_env: OPENAI_API_KEY
  timeout_s: 20.0
  temperature: 0.1
  min_stage_dwell_s: 2.0
  cooldown_s: 3.0
  verify_window_s: 2.0
  max_recent_events: 20
  trigger_on_inconclusive: true
  auto_rewrite_request: true
  allow_actions:
    - continue
    - retry_same_stage
    - hold_and_reobserve
    - switch_cue_priority
    - insert_verify_stage
    - fallback_to_search
    - safe_terminate
  auto_apply_actions:
    - retry_same_stage
    - hold_and_reobserve
    - switch_cue_priority
    - fallback_to_search
    - safe_terminate
  allow_insert_verify_stage: false
  allow_unknown_target_stage: false

semantic_verifier:
  enabled: true
  backend: api
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
  model: qwen-plus
  api_key_env: DASHSCOPE_API_KEY
  timeout_s: 20.0
  temperature: 0.1
  include_image: false
  min_stage_dwell_s: 0.0
  cooldown_s: 0.5
  trigger_always: true
  trigger_on_ambiguous: true
  trigger_on_inconclusive: true
  trigger_on_relations: true
  trigger_on_failure: false
  auto_apply_followup: true
  allow_followups:
    - continue
    - hold_and_reobserve
    - retry_same_stage
    - insert_verify_stage
    - switch_cue_priority
    - fallback_to_search
